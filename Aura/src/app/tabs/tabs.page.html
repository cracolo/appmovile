<ion-tabs>
  <ion-tab-bar slot="bottom">
    @if (authService.isCuidador()) {
      <ion-tab-button tab="cuidador-inicio">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        <ion-label>AURA</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="cuidador-alertas">
        <ion-icon name="notifications-outline"></ion-icon>
        <ion-label>Alertas</ion-label>
        @if (auraData.alertasSinLeer() > 0) {
          <ion-badge color="danger">{{ auraData.alertasSinLeer() }}</ion-badge>
        }
      </ion-tab-button>

      <ion-tab-button tab="cuidador-mapa">
        <ion-icon name="map-outline"></ion-icon>
        <ion-label>Ubicación</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="cuidador-emergencias">
        <ion-icon name="call-outline"></ion-icon>
        <ion-label>Emergencias</ion-label>
      </ion-tab-button>
    }

    @if (authService.isPaciente()) {
      <ion-tab-button tab="paciente-sensores">
        <ion-icon name="hardware-chip-outline"></ion-icon>
        <ion-label>Sensores</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="paciente-panico">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <ion-label>Pánico</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
