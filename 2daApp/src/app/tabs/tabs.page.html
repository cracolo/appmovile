<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Bienvenida</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" [disabled]="!authService.isAuthenticated()">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <ion-label>AURA</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" [disabled]="!authService.isAuthenticated()">
      <ion-icon name="notifications-outline"></ion-icon>
      <ion-label>Alertas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab4" [disabled]="!authService.isAuthenticated()">
      <ion-icon name="hardware-chip-outline"></ion-icon>
      <ion-label>Sensores</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab5" [disabled]="!authService.isAuthenticated()">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <ion-label>Ayuda</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
